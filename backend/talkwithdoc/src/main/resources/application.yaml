spring:
  application:
    name: talkwithdoc

  datasource:
    url: jdbc:postgresql://localhost:5432/talkwithdoc
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
          format_sql: true